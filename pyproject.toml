[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariance-audit"
version = "0.1.0"
description = "Audit whether ViT internal features stay stable under output-preserving transforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "pillow>=10",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "huggingface-hub>=0.20",
]

[project.optional-dependencies]
open-clip = ["open-clip-torch>=2.24"]
data = ["datasets>=2.19"]
kaggle = ["kaggle>=1.5"]
test = ["pytest>=7.4"]

[project.scripts]
invariance-audit = "cli:main"

[tool.setuptools]
# cli.py is a top-level module, not a package. Without this the
# `invariance-audit` console script installs but cannot import cli.
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["interp_core*", "audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
